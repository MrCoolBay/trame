# CI GitLab. La forge cible est GitLab self-hosted : pas de GitHub Actions ici.
#
# Trame ne cible que macOS, mais fmt / clippy / test sont agnostiques de la
# plateforme tant que le code ne touche ni FSEvents ni Keychain. Les jobs
# tournent donc sur un runner Linux docker, et un job `build:macos` optionnel
# couvre la cible reelle sur un runner tague `macos` quand il en existe un.

stages: [check, test, build]

# ★ `trame-gui` est exclue des jobs Linux, et ce n'est pas un oubli.
#
# gpui n'a de couche plateforme sur Linux que derriere les features `x11` ou `wayland`, que
# nous n'activons pas : Trame ne cible que macOS (ADR 0001), et les activer tirerait des
# dizaines de dependances pour une cible qu'on refuse. Constate en lisant `platform.rs`, pas
# compile — aucune cible Linux n'est installee sur la machine de dev.
#
# Consequence assumee : la GUI n'est couverte que par le job `macos`, qui est manuel tant
# qu'aucun runner macOS n'existe. C'est un trou nomme.

default:
  image: rust:1.97
  tags: [docker]
  before_script:
    - rustc --version && cargo --version
  cache:
    key:
      files: [Cargo.lock]
    paths: [.cargo/, target/]

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

fmt:
  stage: check
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

clippy:
  stage: check
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets --exclude trame-gui -- -D warnings

# La feature `test-support` de trame-core expose une horloge manipulable. Elle doit
# rester confinee aux dev-dependencies : une fuite dans un build de production ne
# produirait aucun warning, d'ou ce job.
features:
  stage: check
  script:
    - >
      if cargo tree --workspace -e features -i trame-core --edges no-dev | grep -q 'test-support';
      then echo "ECHEC : test-support atteignable hors dev-dependencies"; exit 1; fi
    - echo "features : test-support confinee aux dev-dependencies"

test:
  stage: test
  script:
    - cargo test --workspace --all-targets --exclude trame-gui

# ★ Surveille un comportement tiers dont depend l'invariant d'interception, et qui a deja
# change une fois. Sans ce job, une mise a jour de l'adaptateur pourrait supprimer la
# raison d'exister du produit sans qu'aucun test ne bronche.
canari:acp:
  stage: test
  script:
    - apt-get update && apt-get install -y nodejs npm
    # Version epinglee : voir l'ADR 0017. Le successeur ne retire plus Write ni Edit.
    - npm install -g @zed-industries/claude-code-acp@0.16.2
    - cargo test -p trame-agent --test canari_interception -- --nocapture

build:
  stage: build
  script:
    - cargo build --workspace --release --exclude trame-gui

# La seule cible qui compte vraiment. Non bloquant tant qu'aucun runner macOS
# n'est enregistre sur l'instance.
build:macos:
  stage: build
  tags: [macos]
  cache: {}
  before_script: []
  script:
    - cargo build --workspace --release --target aarch64-apple-darwin
  allow_failure: true
  rules:
    - when: manual

# ★ La GUI, et le seul job qui couvre les shaders compiles au lancement.
#
# `runtime_shaders` deplace la compilation des shaders Metal du build vers le DEMARRAGE
# (ADR 0023). Une regression de ce chemin ne casse aucune compilation : elle casse la
# premiere image. Le test de fumee ouvre donc une vraie fenetre et exige qu'une image soit
# produite, sinon il sort 1.
#
# EXIGE UNE SESSION GRAPHIQUE AQUA. Un runner macOS en mode service, sans utilisateur
# connecte, ne peut pas se connecter au WindowServer : le job echouera, et c'est preferable
# a un job qui passe sans avoir rien vu.
gui:macos:
  stage: test
  tags: [macos]
  cache: {}
  before_script: []
  script:
    - cargo clippy -p trame-gui -p trame-view --all-targets -- -D warnings
    - cargo test -p trame-gui -p trame-view --all-targets
    - just fumee
  allow_failure: true
  rules:
    - when: manual
