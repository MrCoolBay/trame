msrv = "1.97"

# Les lints unwrap_used / expect_used / panic sont en `deny` dans
# [workspace.lints.clippy]. Ces trois exemptions les neutralisent dans les tests,
# ou un unwrap est la facon la plus lisible d'echouer.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = false

# Un acteur qui recoit un message a 12 champs est un acteur mal decoupe.
too-many-arguments-threshold = 6
type-complexity-threshold = 250

# Vocabulaire du projet : ces termes s'ecrivent comme ca et pas autrement.
doc-valid-idents = ["ACP", "GitButler", "SQLite", "FSEvents", "GitLab", "JSON-RPC", "PTY", "blake3", "macOS", "MIT", "FSL", "TUI", "..."]
