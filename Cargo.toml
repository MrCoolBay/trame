[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/trame/trame"
authors = ["Fabien Lubin <flubin@francecyberdefense.fr>"]
publish = false

# Trame ne cible que macOS. Aucune abstraction cross-platform, aucun `cfg(target_os)`
# defensif : si ca ne compile pas sur aarch64-apple-darwin, ca ne compile pas.

[workspace.dependencies]
# Crates internes. Une seule direction de dependance :
#   core <- journal <- registry <- {agent, vcs} <- daemon <- view <- {tui, gui}
# `trame-hook` est a part : un binaire lance par la CLI, qui ne depend d'AUCUN crate interne.
# C'est voulu — il ne decide rien, donc il n'a besoin de rien connaitre du produit.
# trame-core ne depend d'aucun crate interne. Jamais.
trame-core = { path = "crates/trame-core" }
trame-journal = { path = "crates/trame-journal" }
trame-registry = { path = "crates/trame-registry" }
trame-agent = { path = "crates/trame-agent" }
trame-vcs = { path = "crates/trame-vcs" }
trame-daemon = { path = "crates/trame-daemon" }
trame-view = { path = "crates/trame-view" }
trame-hook = { path = "crates/trame-hook" }

# Dependances externes, versions decidees une seule fois ici.
# Un crate qui a besoin d'une feature en plus l'ajoute chez lui avec
# `features = [...]`, il ne redeclare jamais la version.
anyhow = "1.0"
async-trait = "0.1"
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
crossterm = "0.29"
# GUI — l'amont Zed publie, epingle exact (ADR 0023).
#
# `runtime_shaders` evite le compilateur `metal` a la compilation, donc l'installation
# d'Xcode complet. `default-features = false` ecarte les backends x11/wayland, inutiles sur
# une cible macOS uniquement.
#
# Pas de `gpui_platform` : l'amont embarque sa couche plateforme. C'etait la seconde ligne du
# fork `gpui-ce`, qui reste l'echappatoire inverse — le nom d'import ne change pas.
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
futures-core = "0.3"
ignore = "0.4"
notify = "8.2"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = "1.53"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.24", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Invariant CLAUDE.md : aucun unwrap/expect/panic hors des tests.
# clippy.toml porte les exemptions `allow-*-in-tests`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "allow"          # les `todo!()` de couture sont explicites et voulus en v0.1
dbg_macro = "deny"
print_stdout = "deny"   # tout passe par `tracing`, jamais par println!
print_stderr = "deny"

# ★ Pourquoi ce profil existe : `target/` a atteint 21 Go et rempli le volume.
#
# Le diagnostic, mesure plutot que suppose :
#
#   .o objets        9,3 Go   120 795 fichiers
#   .rlib            6,8 Go     1 703
#   .rmeta           2,3 Go     2 851
#   binaires de test 1,5 Go       224   dont 32 copies de trame_daemon
#
# Trois causes, dont la premiere est la plus couteuse et la moins visible :
#
# 1. `debug = 2` par defaut en dev. Sur macOS, Rust laisse le debuginfo en `.o`
#    non empaquetes — d'ou 120 000 fichiers pour 9,3 Go. `line-tables-only` garde
#    le `fichier:ligne` dans les backtraces de panique, qui est la seule chose dont
#    ce projet se sert, et supprime les types. C'est l'arbitrage : un debugger pas-a-pas
#    y perd, `cargo test` n'y perd rien.
# 2. Cargo ne ramasse jamais ses vieux artefacts. Chaque changement de features ou de
#    dependance laisse une copie complete derriere. Une session longue en accumule des
#    dizaines. `just clean` est la pour ca.
# 3. gpui pese 160 Mo par rlib et se rebatit une fois par combinaison de features.
#    Notre `font-kit + runtime_shaders`, les defauts que gpui-component reclame,
#    `test-support` — dix copies coexistaient.
[profile.dev]
debug = "line-tables-only"

# Les dependances n'ont pas besoin de debuginfo du tout : on ne met pas de point
# d'arret dans gpui. C'est la ou se trouvait l'essentiel des 9,3 Go.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
