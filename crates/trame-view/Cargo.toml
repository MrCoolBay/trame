[package]
name = "trame-view"
description = "L'etat d'affichage, partage par les interfaces. Aucune dependance a un moteur de rendu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "trame_view"
path = "src/lib.rs"

[dependencies]
trame-core.workspace = true
trame-daemon.workspace = true
trame-journal.workspace = true
trame-registry.workspace = true

anyhow.workspace = true
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
trame-core = { workspace = true, features = ["test-support"] }
chrono.workspace = true

[lints]
workspace = true
