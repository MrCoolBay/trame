[package]
name = "trame-core"
description = "Types et coutures partages de Trame. Ne depend d'aucun autre crate du workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
blake3.workspace = true
chrono.workspace = true
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
# Horloge manipulable et constructeurs de test. Active par les crates qui
# testent du code sensible au temps (registry en tete), jamais en production.
test-support = []

[lints]
workspace = true
