[package]
name = "trame-tui"
description = "TUI ratatui. Valide le modele sans investir dans une UI qui va bouger dix fois."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "trame_tui"
path = "src/lib.rs"

[[bin]]
name = "trame-tui"
path = "src/main.rs"

[dependencies]
trame-core.workspace = true
trame-daemon.workspace = true
trame-journal.workspace = true
trame-registry.workspace = true

anyhow.workspace = true
crossterm.workspace = true
ratatui.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# `trame-agent` n'est utile qu'aux exemples : l'interface elle-meme ne parle jamais a un
# harness, elle ne fait que recevoir des observations.
trame-agent.workspace = true
trame-core = { workspace = true, features = ["test-support"] }
chrono.workspace = true

[lints]
workspace = true
