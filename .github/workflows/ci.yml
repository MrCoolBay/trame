# GitHub Actions CI. Replaces `.gitlab-ci.yml`, which could not run on a GitHub repository
# without a mirror — and two files would have diverged.
#
# The forge Trame **drives** is still self-hosted GitLab (ADR 0011): this file is about where
# Trame's code lives, not about what Trame knows how to drive. The two decisions are
# independent (ADR 0019).
#
# ★ Three Linux jobs, one macOS job, and one rule that explains the split:
# **a job that goes green must measure what it claims to measure.**
#
# `trame-gui` is excluded from the Linux jobs, and that is not an oversight: gpui has a Linux
# platform layer only behind the `x11` or `wayland` features, which we do not enable since
# Trame targets macOS only (ADR 0001). It is covered by the `macos` job.
#
# `real_watcher` only compiles on macOS (`#![cfg(target_os = "macos")]`), for a reason worth
# reading: `notify::recommended_watcher` picks **inotify** on Linux. A Linux job would have
# turned green on a test whose name says "FSEvents, for real" while measuring a different
# backend. That is the failure mode this project has paid for six times — a plausible green
# that does not measure what it claims.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  verifier:
    name: fmt · clippy · features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --exclude trame-gui -- -D warnings
      # trame-core's `test-support` feature exposes a manipulable clock. It must stay
      # confined to dev-dependencies: a leak into a production build would produce no
      # warning at all, hence this explicit guard.
      - name: test-support confined to dev-dependencies
        run: |
          if cargo tree --workspace -e features -i trame-core --edges no-dev | grep -q 'test-support'; then
            echo "FAILED: test-support reachable outside dev-dependencies" >&2
            exit 1
          fi
          echo "features: test-support confined to dev-dependencies"

      # ★ The language guard. The repository is English-only, and a convention nothing
      # checks lasts one session. It carries a dated debt list for the files whose
      # conversion is still owed, and it prints that debt on every run — including when
      # it is green, so the exclusion never reads as a clean bill.
      - name: language — English only, with the debt declared
        run: python3 scripts/no_french.py .

      # And the guard's own negative control, because a measuring device nobody has seen
      # fail has not been verified. It runs before every scan too; this step makes its
      # result visible on its own.
      - name: language guard — negative control
        run: python3 scripts/no_french.py --self-test

  tester:
    name: tests · build release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --exclude trame-gui
      - run: cargo build --workspace --release --exclude trame-gui

  canary:
    name: ACP canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@v2
      # ★ Watches a third-party behaviour the interception invariant depends on, and which
      # has already disappeared once in the successor package. Without this job, an adapter
      # update could remove the product's reason to exist without a single test flinching.
      # Pinned version: ADR 0017.
      #
      # Portable to Linux because the technique NEVER launches the real `claude`: it captures
      # the argv the adapter *would* have passed. No authentication, no tokens spent.
      - run: npm install -g @zed-industries/claude-code-acp@0.16.2
      - run: cargo test -p trame-agent --test interception_canary -- --nocapture

  macos:
    name: macOS — GUI, FSEvents, smoke
    # It was manual at first, while a question we could not deduce got settled: does a GitHub
    # macOS runner have a graphical session usable by an AppKit app?
    #
    # **Measured 2026-08-13, on this runner**: `launchctl managername` returns `Aqua` and
    # `/dev/console` is owned by `runner`. The window opens, `just smoke` returns SMOKE_OK.
    # The job therefore sits on the critical path: it is the ONLY one covering the GUI,
    # FSEvents and the shaders, and macOS minutes are free on a public repository.
    #
    # Observed duration: ~5 min 20 s end to end.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just

      - name: the runner's graphical environment
        # A diagnostic BEFORE the smoke test: if the window does not open, we want to know
        # whether that is for lack of a graphical session or for some other reason.
        run: |
          echo "user: $(id -un)"
          echo "launchd session: $(launchctl managername 2>/dev/null || echo unknown)"
          echo "console: $(stat -f%Su /dev/console 2>/dev/null || echo unknown)"
          xcode-select -p
          xcrun -f metal 2>&1 || echo "metal absent — expected, runtime_shaders avoids it"

      - run: cargo clippy -p trame-gui -p trame-view --all-targets -- -D warnings
      - run: cargo test -p trame-gui -p trame-view --all-targets

      # ★ The FSEvents tests. They run ONLY here: on Linux `notify` picks inotify, and a green
      # Linux run on these tests would be false assurance about macOS.
      #
      # ★ The target name is `real_watcher`, and it was `watcher_reel` in this file until
      # 2026-08-14 — a DEAD COMMAND, left behind when the file was renamed during the English
      # pass. `cargo test --test watcher_reel` exits 101 with "no test target named". A
      # renamed target is not a cosmetic change: it is a step that stopped running.
      - run: cargo test -p trame-daemon --test real_watcher -- --nocapture

      # ★ The shader smoke test. `runtime_shaders` moves their compilation from the build to
      # LAUNCH (ADR 0023): a green compile proves nothing about that path. `just smoke` opens
      # a window and requires that an IMAGE was actually produced.
      #
      # THIS is the step that answers the Aqua question. It fails loudly if the window does
      # not open, which is preferable to a job that passes without having seen anything.
      - run: just smoke
